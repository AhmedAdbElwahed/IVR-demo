[global]
type=global
user_agent=Asterisk IVR System
endpoint_identifier_order=auth_username,username,ip

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; --- TEMPLATES ---
[endpoint_auth](!)
type=auth
auth_type=userpass

[endpoint_aor](!)
type=aor
max_contacts=1
remove_existing=yes

[endpoint_base](!)
type=endpoint
context=from-internal
disallow=all
allow=ulaw
allow=alaw
direct_media=no
transport=transport-udp
rewrite_contact=yes
force_rport=yes

; --- EXTENSIONS ---

; Extension 101 (Support Agent 1)
[101](endpoint_base)
auth=auth101
aors=101

[auth101](endpoint_auth)
username=101
password=SuperSecurePassword101!

[101](endpoint_aor)

; Extension 102 (Support Agent 2)
[102](endpoint_base)
auth=auth102
aors=102

[auth102](endpoint_auth)
username=102
password=SuperSecurePassword102!

[102](endpoint_aor)

; Extension 103 (Support Agent 3)
[103](endpoint_base)
auth=auth103
aors=103

[auth103](endpoint_auth)
username=103
password=SuperSecurePassword103!

[103](endpoint_aor)

; Operator
[operator](endpoint_base)
auth=auth_operator
aors=operator

[auth_operator](endpoint_auth)
username=operator
password=SuperSecurePasswordOperator!

[operator](endpoint_aor)