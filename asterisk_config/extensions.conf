[general]
static=yes
writeprotect=no

[globals]
; Path to audio files (relative to Asterisk sounds directory or absolute)
; Assuming these files are in a 'custom' folder or root sounds folder.
; We will use the filenames provided.

[from-internal]
exten => 1000,1,NoOp(Starting Tech Support IVR)
 same => n,Goto(ivr-main,s,1)

; Helper for Ring Group (101, 102, 103)
exten => ring_support,1,Dial(PJSIP/101&PJSIP/102&PJSIP/103,30)
 same => n,Hangup()

; --- Main Menu ---
[ivr-main]
exten => s,1,Answer()
 same => n,Set(CDR(userfield)=IVR_START)
 same => n,Playback(custom/valoro/valoro-welcome) 
 ; "Welcome to..."
 
 same => n(menu),Playback(custom/valoro/valoro-main-menu) 
 ; "Press 1 for Sales (skip), 2 for Support, 3 for Billing (skip), 0 for Operator"
 ; Since we are modifying for Tech Support Only, we might technically be mis-using the audio 
 ; if it lists options we don't support. 
 ; However, per instructions "use suitable audios", we assume 'valoro-main-menu' is the best fit.
 ; We will only implement the logic for Support and Operator.
 
 same => n,WaitExten(10)

; 2 -> Support (Mapped to 1 for our simplified "Tech Support" view? 
; The user said "except there is no sails or payments".
; If the audio says "Press 2 for Support", we must listen for 2.
exten => 2,1,Goto(ivr-support,s,1)

; 0 -> Operator
exten => 0,1,Goto(ivr-operator,s,1)

; Invalid
exten => i,1,Playback(custom/valoro/valoro-invalid)
 same => n,Goto(ivr-main,menu)

; Timeout
exten => t,1,Playback(custom/valoro/valoro-timeout)
 same => n,Goto(ivr-main,menu)


; --- Support Menu ---
[ivr-support]
exten => s,1,NoOp(Support Menu)
 same => n(menu),Playback(custom/valoro/valoro-support-menu)
 ; "Press 1 for Tech Issue, 2 for Account Issue"
 same => n,WaitExten(10)

; 1 -> Technical Issue (Create Ticket via ARI)
exten => 1,1,Set(DEPT=support)
 same => n,Set(TICKET_TYPE=technical_issue)
 same => n,Playback(custom/valoro/valoro-support-tech) ; "Please record your issue..."
 same => n,Goto(ivr-create-ticket,s,1)

; 2 -> Account Issue (Create Ticket via ARI)
exten => 2,1,Set(DEPT=support)
 same => n,Set(TICKET_TYPE=account_issue)
 same => n,Playback(custom/valoro/valoro-support-account)
 same => n,Goto(ivr-create-ticket,s,1)
 
; 3 -> Talk to Agent (Custom addition if we want option to ring group)
; If we want to offer live agent, we can add it here.
; Let's add option 3 for Live Agent if the user prefers.
exten => 3,1,Playback(custom/valoro/valoro-operator) ; "Please hold..."
 same => n,Goto(ivr-ring-group,s,1)

; 0 -> Operator
exten => 0,1,Goto(ivr-operator,s,1)

exten => i,1,Playback(custom/valoro/valoro-invalid)
 same => n,Goto(ivr-support,menu)

exten => t,1,Playback(custom/valoro/valoro-timeout)
 same => n,Goto(ivr-support,menu)


; --- Actions ---

[ivr-operator]
exten => s,1,NoOp(Calling Operator)
 same => n,Playback(custom/valoro/valoro-operator)
 same => n,Dial(PJSIP/operator,30)
 same => n,Hangup()

[ivr-ring-group]
exten => s,1,NoOp(Calling Support Group)
 same => n,Dial(PJSIP/101&PJSIP/102&PJSIP/103,30)
 same => n,Hangup()

[ivr-create-ticket]
exten => s,1,NoOp(Handing over to Node.js for Ticket Creation)
 ; Stasis app 'freshdesk-ivr' will handle recording and API
 same => n,Stasis(freshdesk-ivr,${DEPT},${TICKET_TYPE})
 same => n,Hangup()