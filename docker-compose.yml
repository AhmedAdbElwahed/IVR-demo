version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: ivr_postgres
    restart: always
    environment:
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-secret}
      POSTGRES_DB: ${PG_DATABASE:-ivr_db}
    ports:
      - "${PG_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: ivr_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db
    logging:
      driver: "none" # Reduce noise for this demo/dev tool

volumes:
  postgres_data:
